name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install
      - run: npm run build --workspace=@kruto52/shared
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build --workspaces --if-present

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential
      - name: Build cubiomes + worker (release)
        run: make -C packages/worker
      - name: Smoke test seed_worker
        run: |
          echo '{"id":"ci","mc":"1.21","large_biomes":false,"radius":500,"biomes":["plains"],"structures":["village"],"exclude_seeds":[],"max_seeds":10000,"timeout_ms":15000,"threads":2}' \
            | timeout 30 ./packages/worker/seed_worker
      - name: Smoke test seed_precompute
        run: |
          ./packages/worker/seed_precompute 1.21 0 3 42 2 | head -3
